<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Riwayat Pendidikan</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 20px;
      color: #000000;
    }

    .kotak {
      background-color: #E6F4FB;   
      border: 1px solid #555555;
      padding: 20px 30px 30px 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    caption {
      font-size: 18px;
      margin-bottom: 8px;
      color: #000080;              
    }

    th, td {
      border: 1px solid #555555;
      padding: 10px 12px;
      text-align: left;
    }

    th {
      background-color: #A8D8F0;
    }

    
    td {
      background-color: #FFF6B3;
    }

    
    td:first-child {
      color: #000080;
    }
  </style>
</head>
<body>

  <div class="kotak">
    <h1>Riwayat Pendidikan</h1>

    <table>
      <caption>Riwayat Pendidikan</caption>
      <thead>
        <tr>
          <th>No</th>
          <th>Jenjang Pendidikan</th>
          <th>Nama Sekolah</th>
          <th>Tahun</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>1</td>
          <td>SD</td>
          <td>SD Negeri Karyamekar</td>
          <td>2013 - 2018</td>
        </tr>
        <tr>
          <td>2</td>
          <td>MTS</td>
          <td>MTS Darul Hikmah</td>
          <td>2018 - 2022</td>
        </tr>
        <tr>
          <td>3</td>
          <td>SMA</td>
          <td>SMA Negeri 1 Cibatu</td>
          <td>2022 - 2025</td>
        </tr>
        <tr>
          <td>4</td>
          <td>S1</td>
          <td>Universitas Mandiri</td>
          <td>2026 - Sekarang</td>
        </tr>
      </tbody>
    </table>
  </div>

</body>
</html>
