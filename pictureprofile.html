<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil Mahasiswa</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 20px;
      background-color: #ffffff;
    }

    .kotak-profil {
      width: 500px;
      max-width: 100%;
      padding: 20px;
      background-color: #FFD8B0;   
      border: 2px solid #E0A070;
      border-radius: 8px;
      color: #D00000;              
      font-weight: bold;           
    }

    .kotak-profil h1 {
      font-size: 24px;
      margin-top: 0;
    }

    .kotak-profil h3 {
      margin-bottom: 8px;
    }

    .kotak-profil img {
      width: 200px;
      height: auto;
      display: block;
      border: 2px solid #D00000;
    }

    .kotak-profil p {
      line-height: 1.6;
    }

    .sorot {
      background-color: yellow;
    }
  </style>
</head>
<body>

  <div class="kotak-profil">
    <h1>Profil Mahasiswa</h1>

    <img src="IMG-20261010-WA0000.jpg" alt="Foto Mahasiswa">

    <h3>Data Diri</h3>
    <p>
      Nama saya <b>Zahra Aulia</b>. Saya adalah mahasiswa <i>Sistem Informasi</i>.<br>
      Saya sedang mempelajari <b>HTML, CSS, dan JavaScript</b>.<br>
      Target saya adalah menjadi <mark class="sorot">(Web Developer)</mark>.
    </p>
  </div>

</body>
</html>
